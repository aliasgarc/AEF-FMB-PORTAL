<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#3c7441" rx="45"/>

  <!-- Decorative circle at top -->
  <circle cx="96" cy="50" r="28" fill="#5a9b62" opacity="0.3"/>

  <!-- Main icon - stylized book/document -->
  <rect x="45" y="55" width="102" height="85" fill="white" rx="8" opacity="0.95"/>

  <!-- Document lines -->
  <line x1="60" y1="75" x2="132" y2="75" stroke="#3c7441" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="132" y2="90" stroke="#3c7441" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="60" y1="105" x2="115" y2="105" stroke="#3c7441" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="60" y1="120" x2="120" y2="120" stroke="#3c7441" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Accent corner badge -->
  <circle cx="145" cy="145" r="18" fill="#5a9b62"/>
  <text x="145" y="152" font-size="24" font-weight="bold" fill="white" text-anchor="middle">✓</text>
</svg>
